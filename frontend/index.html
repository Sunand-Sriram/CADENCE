<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CADENCE — Cryptographic Asset Discovery Engine</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <h1>CADENCE</h1>
        <p class="tagline">Cryptographic Asset Discovery Engine</p>
      </div>
    </header>

    <main>
      <section class="ingest-bar">
        <form id="ingest-form" class="ingest-form">
          <label for="repo-url">GitHub repository URL</label>
          <div class="input-row">
            <input id="repo-url" name="repo_url" type="url" placeholder="https://github.com/org/repository" autocomplete="off">
            <button type="submit">Analyze</button>
          </div>
        </form>
      </section>

      <p id="backend-message" class="backend-message" role="status" aria-live="polite"></p>

      <section id="cbom-section">
        <div class="section-heading"><h2>CBOM</h2><span id="asset-count" class="section-meta">— ASSETS</span></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Algorithm</th><th>Asset ID</th><th>File:Line</th><th>Operation</th><th>Status</th></tr></thead>
            <tbody id="cbom-body"><tr><td colspan="5" class="empty-state">Loading crypto assets…</td></tr></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
