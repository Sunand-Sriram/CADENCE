<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CADENCE — Cryptographic Asset Discovery Engine</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <h1>CADENCE</h1>
        <p class="tagline">Cryptographic Asset Discovery Engine</p>
      </div>
      <nav id="tab-bar" class="tab-bar" aria-label="Dashboard sections">
        <button class="tab" type="button" data-tab="overview">Overview</button>
        <button class="tab active" type="button" data-tab="cbom">CBOM</button>
        <button class="tab" type="button" data-tab="risk">Risk</button>
        <button class="tab" type="button" data-tab="quantum">Quantum</button>
        <button class="tab" type="button" data-tab="fixes">Fixes</button>
        <button class="tab" type="button" data-tab="approval">Approval</button>
      </nav>
      <p id="repo-context" class="repo-context" aria-live="polite"></p>
    </header>

    <main>
      <section class="ingest-bar">
        <form id="ingest-form" class="ingest-form">
          <label for="repo-url">GitHub repository URL</label>
          <div class="input-row">
            <input id="repo-url" name="repo_url" type="url" placeholder="https://github.com/org/repository" autocomplete="off">
            <button type="submit">Analyze</button>
          </div>
        </form>
        <div id="analyze-progress" class="progress-wrap" hidden>
          <div class="progress-row"><span id="analyze-progress-label">Analyzing</span><span id="analyze-progress-percent">0%</span></div>
          <div class="progress-track"><div id="analyze-progress-fill" class="progress-fill"></div></div>
        </div>
      </section>

      <p id="backend-message" class="backend-message" role="status" aria-live="polite"></p>

      <div id="dashboard-sections">
      <section id="cbom-section" class="dashboard-section">
        <div class="section-heading"><h2>CBOM</h2><span id="asset-count" class="section-meta">— ASSETS</span></div>
        <div class="table-panel">
          <div class="table-panel-header">Cryptographic Assets</div>
          <div class="table-wrap">
          <table>
            <thead><tr><th>Algorithm</th><th>Asset ID</th><th>File:Line</th><th>Operation</th><th>Weakness</th></tr></thead>
            <tbody id="cbom-body"><tr><td colspan="5" class="empty-state">Loading crypto assets…</td></tr></tbody>
          </table>
          </div>
        </div>
      </section>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
